name: Déploiement OVH (export statique)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Runner self-hosted (Windows, DESKTOP-QCEQ0TH) : les runners GitHub-hosted
    # se sont vus refuser l'authentification SFTP par OVH ("Permission denied")
    # alors que les mêmes identifiants fonctionnent depuis ce poste (FileZilla,
    # sftp natif). Le déploiement s'exécute donc directement sur ce runner.
    runs-on: self-hosted

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      # `shell: powershell` (Windows PowerShell 5.1) et non `pwsh` :
      # PowerShell 7 n'est pas installé par défaut sur Windows, et le run 14
      # a échoué exactement à la première étape qui déclarait `pwsh` — les
      # étapes précédentes, sans shell explicite, utilisaient le shell par
      # défaut et passaient toutes.
      - name: Vérifier que out/ existe
        shell: powershell
        run: |
          if (-not (Test-Path "out/index.html")) {
            # Dit pourquoi plutôt que d'échouer en silence : sans ce
            # listing, un out/ manquant ne se distingue pas d'un build
            # sorti ailleurs ou d'un workspace laissé sale.
            Write-Output "Répertoire de travail : $(Get-Location)"
            Write-Output "Contenu de la racine :"
            Get-ChildItem | Select-Object -ExpandProperty Name
            if (Test-Path "out") {
              Write-Output "Contenu de out/ :"
              Get-ChildItem "out" | Select-Object -ExpandProperty Name
            } else {
              Write-Output "Le dossier out/ n'existe pas du tout."
            }
            Write-Error "out/index.html manquant"
            exit 1
          }
          Write-Output "Build OK"

      # Posh-SSH (module PowerShell) plutôt que sshpass/plink : permet de
      # construire les identifiants en mémoire (PSCredential/SecureString)
      # sans jamais les passer en argument de ligne de commande, donc sans
      # exposition dans les logs ou la liste des process Windows.
      - name: Installer le module Posh-SSH
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Posh-SSH)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module -Name Posh-SSH -Force -Scope CurrentUser -Confirm:$false
          }
          Import-Module Posh-SSH

      # -AcceptKey accepte et épingle la clé d'hôte au premier contact (dans
      # le magasin de clés connues de Posh-SSH sur ce runner), équivalent du
      # StrictHostKeyChecking=accept-new utilisé côté OpenSSH.
      - name: Déployer sur OVH via SFTP (Posh-SSH)
        shell: powershell
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_REMOTE_DIR: ${{ secrets.OVH_FTP_REMOTE_DIR }}
        run: |
          Import-Module Posh-SSH

          $securePassword = ConvertTo-SecureString -String $env:OVH_FTP_PASSWORD -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:OVH_FTP_USERNAME, $securePassword)

          $session = New-SFTPSession -ComputerName $env:OVH_FTP_SERVER -Port 22 -Credential $credential -AcceptKey -ErrorAction Stop

          try {
            # Envoie chaque entrée de out/ vers le dossier distant, en
            # conservant les sous-dossiers. Aucune suppression distante :
            # les fichiers déjà présents et absents de out/ restent en place.
            Get-ChildItem -Path "out" | ForEach-Object {
              Set-SFTPItem -SessionId $session.SessionId -Path $_.FullName -Destination $env:OVH_FTP_REMOTE_DIR -Force
            }
          }
          finally {
            Remove-SFTPSession -SessionId $session.SessionId | Out-Null
          }
