name: Déploiement OVH (export statique)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Vérifier que out/ existe
        run: |
          test -f out/index.html || (echo "out/index.html manquant" && exit 1)
          echo "Build OK"

      # OVH mutualisé refuse AUTH TLS ("500 This security scheme is not
      # implemented") — FTPS n'est pas une option sur cet hébergement.
      # SFTP (SSH, port 22) utilise les mêmes identifiants FTP-SSH que
      # ceux déjà configurés dans OVH_FTP_USERNAME/OVH_FTP_PASSWORD — ce
      # sont les identifiants "FTP-SSH" visibles dans l'espace client OVH,
      # pas un couple différent. Mêmes secrets, protocole différent.
      - name: Déployer sur OVH via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          port: "22"
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          ssh_private_key: ""
          sftp_only: true
          local_path: "./out/*"
          remote_path: ${{ secrets.OVH_FTP_REMOTE_DIR }}
          # Ne jamais activer : viderait le dossier distant avant l'envoi.
          delete_remote_files: false
