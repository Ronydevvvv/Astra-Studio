name: Déploiement OVH (export statique)

# Se déclenche sur push vers `main` (branche de production), et peut aussi
# être lancé manuellement depuis l'onglet Actions de GitHub — utile pour
# vérifier que le workflow et les secrets sont corrects avant de compter
# dessus automatiquement.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Un déploiement à la fois : si deux push arrivent coup sur coup, le second
# attend que le premier soit fini plutôt que d'envoyer deux transferts FTP
# en parallèle sur le même dossier distant.
concurrency:
  group: deploy-ovh-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Build (export statique Next.js → out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Vérifier que out/ existe et contient bien le site
        run: |
          test -f out/index.html || (echo "out/index.html manquant — le build n'a pas produit d'export statique." && exit 1)
          echo "out/ généré avec $(find out -type f | wc -l) fichiers."

      - name: Déployer sur OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          # Dossier distant OVH où pointe le domaine astrastudio.pro.
          # Valeur par défaut : racine du compte FTP. À adapter via le
          # secret OVH_FTP_REMOTE_DIR si le site vit dans un sous-dossier
          # (ex: /www/ ou /astrastudio.pro/www/) — voir le diagnostic.
          server-dir: ${{ secrets.OVH_FTP_REMOTE_DIR || '/' }}
          # Ne JAMAIS activer dangerous-clean-slate: cela viderait le
          # dossier distant avant l'envoi. On laisse le comportement par
          # défaut (sync différentiel : envoie ce qui a changé, ne
          # supprime rien côté serveur qui n'a pas d'équivalent local que
          # si ce fichier a réellement été retiré du dépôt).
          exclude: |
            **/.git*
            **/.git*/**
