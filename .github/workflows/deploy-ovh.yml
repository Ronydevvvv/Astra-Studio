name: Déploiement OVH (export statique)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Vérifier que out/ existe
        run: |
          test -f out/index.html || (echo "out/index.html manquant" && exit 1)
          echo "Build OK"

      # OVH mutualisé refuse AUTH TLS ("500 This security scheme is not
      # implemented") — FTPS n'est pas une option sur cet hébergement.
      # wlixcc/SFTP-Deploy-Action renvoyait "Permission denied" avec les
      # mêmes identifiants qui fonctionnent dans FileZilla et en sftp
      # natif — l'action elle-même est en cause, pas le mot de passe.
      # On se connecte donc directement en SSH/SFTP avec le client
      # OpenSSH standard (sshpass pour l'auth par mot de passe non
      # interactive), sans passer par une action tierce.
      - name: Installer sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      # accept-new : accepte et épingle la clé d'hôte au premier contact
      # (visible dans les logs du job pour vérification), puis échoue si
      # elle change ensuite — c'est le comportement le plus proche d'une
      # vérification stricte que permet un hôte encore inconnu du runner.
      - name: Préparer la clé d'hôte SSH
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H "$OVH_FTP_SERVER" >> ~/.ssh/known_hosts 2>/dev/null

      # Diagnostic temporaire : vérifie que les secrets arrivent bien et
      # non-vides côté runner, sans jamais afficher leur valeur. À retirer
      # une fois l'origine du "Permission denied" confirmée.
      # continue-on-error : le test SSH ci-dessous échoue déjà de façon
      # confirmée ("Permission denied") — sans ce flag, le job s'arrêterait
      # ici et le test FTP (port 21) qui suit ne s'exécuterait jamais.
      - name: Diagnostic des secrets OVH (temporaire)
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.OVH_FTP_PASSWORD }}
          SERVER: ${{ secrets.OVH_FTP_SERVER }}
          USER: ${{ secrets.OVH_FTP_USERNAME }}
        run: |
          set -euo pipefail
          [ -n "$SERVER" ] && echo "OVH_FTP_SERVER : non vide" || (echo "::error::OVH_FTP_SERVER est vide" && exit 1)
          [ -n "$USER" ] && echo "OVH_FTP_USERNAME : non vide" || (echo "::error::OVH_FTP_USERNAME est vide" && exit 1)
          [ -n "$SSHPASS" ] && echo "OVH_FTP_PASSWORD : non vide" || (echo "::error::OVH_FTP_PASSWORD est vide" && exit 1)
          echo "Longueur du mot de passe (caractères) : $(printf '%s' "$SSHPASS" | wc -c)"
          echo "Username utilisé : $USER"
          echo "Serveur utilisé : $SERVER"

          echo "--- Test de connexion SSH minimal (password only, sans upload) ---"
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -p 22 "$USER@$SERVER" "pwd"

      # Test temporaire, protocole FTP classique (port 21), SANS transfert
      # de fichier : sert uniquement à déterminer si OVH accepte
      # l'authentification depuis le runner GitHub par ce protocole, après
      # que la même authentification par SFTP/port 22 a été refusée
      # ("Permission denied") alors qu'elle fonctionne dans FileZilla.
      # curl est utilisé sans -v : le protocole FTP envoie USER/PASS en
      # clair sur le fil, et un mode verbose afficherait ces commandes
      # (donc le mot de passe) dans les logs du job. Le résultat du test
      # repose uniquement sur le code de sortie de curl et le listing
      # du répertoire distant (qui ne contient aucun secret).
      - name: Test de connexion FTP (port 21, sans upload)
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if curl -s --connect-timeout 15 \
              -u "${OVH_FTP_USERNAME}:${OVH_FTP_PASSWORD}" \
              "ftp://${OVH_FTP_SERVER}:21/" --list-only -o /tmp/ftp_test_list.txt; then
            echo "Connexion FTP (port 21) réussie. Contenu du répertoire distant :"
            cat /tmp/ftp_test_list.txt
          else
            code=$?
            echo "::error::Échec de la connexion FTP (port 21), code curl $code. Aucun mot de passe affiché."
            exit 1
          fi

      - name: Déployer sur OVH via SFTP (OpenSSH natif)
        env:
          SSHPASS: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_REMOTE_DIR: ${{ secrets.OVH_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          # Construit un batch sftp qui envoie chaque entrée de out/ vers
          # le dossier distant, en conservant les sous-dossiers (-r).
          # Aucune suppression distante n'est demandée : les fichiers déjà
          # présents et absents de out/ restent en place.
          batch_file="$(mktemp)"
          {
            echo "cd ${OVH_FTP_REMOTE_DIR}"
            for entry in out/*; do
              name="$(basename "$entry")"
              echo "put -r \"$entry\" \"$name\""
            done
          } > "$batch_file"

          sshpass -e sftp -o StrictHostKeyChecking=accept-new \
            -P 22 -b "$batch_file" "${OVH_FTP_USERNAME}@${OVH_FTP_SERVER}"
